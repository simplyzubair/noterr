name: Build and Release Noterr

# Every push to master that changes the app becomes a release: the version is
# <major>.<minor> from pubspec.yaml plus the run number, so nobody bumps
# versions or pushes tags by hand. Installed apps see the new release and
# update.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'website/**', 'deploy/**', '.env.example']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//' | cut -d. -f1,2)
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # Android versionCode must always grow; +100 keeps it above the
          # hand-set build numbers used before this scheme.
          echo "build=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"
          echo "version $base.${{ github.run_number }}"

  # ────────────────────────────────────────────────────────────────
  # Windows
  # ────────────────────────────────────────────────────────────────
  windows:
    name: Windows App
    needs: version
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter --version | head -1
          flutter analyze 2>&1 | tee analyze.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            # Run logs need auth to read; annotations don't, so surface the issues.
            detail=$( (grep -E '^ *(error|warning|info) - ' analyze.log || tail -n 15 analyze.log) | head -n 15 | paste -sd '~' - | cut -c1-3500)
            echo "::error::flutter analyze failed: $detail"
            exit "$code"
          fi

      - name: Test
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        run: >
          flutter build windows --release
          --build-name=$env:APP_VERSION --build-number=$env:APP_BUILD
          --dart-define=NOTERR_APP_VERSION=$env:APP_VERSION

      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath noterr-windows-v$env:APP_VERSION.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer/noterr.iss'

      - name: Rename installer for release
        shell: pwsh
        run: |
          Copy-Item installer/dist/NoterrSetup.exe `
            NoterrSetup-v$env:APP_VERSION.exe

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: noterr-windows-release
          path: noterr-windows-v*.zip

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: noterr-windows-installer
          path: NoterrSetup-v*.exe

  # ────────────────────────────────────────────────────────────────
  # macOS: unsigned .dmg (no Apple Developer account). The first launch
  # needs right-click > Open; Gatekeeper blocks a double-click.
  # ────────────────────────────────────────────────────────────────
  macos:
    name: macOS App
    needs: version
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: >
          flutter build macos --release
          --build-name=$APP_VERSION --build-number=$APP_BUILD

      - name: Sign for local use and check the app opens
        run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          rm -rf Noterr.app
          cp -R "$app" Noterr.app
          # Ad-hoc signature: required to run on Apple Silicon at all.
          codesign --force --deep --sign - Noterr.app
          codesign --verify --deep --strict Noterr.app
          # Launch it and make sure it is still running and has a window, so
          # a Mac build that can't start never reaches a release.
          open -n Noterr.app
          sleep 20
          pgrep -fl "Noterr.app/Contents/MacOS/" || { echo "::error::Noterr did not stay running on macOS"; exit 1; }
          windows=$(osascript -e 'tell application "System Events" to count windows of (first process whose unix id is '"$(pgrep -f 'Noterr.app/Contents/MacOS/' | head -1)"')' 2>/dev/null || echo "?")
          echo "windows open: $windows"
          # Only the main window should open (a second one was the black
          # sticky window).
          if [ "$windows" -gt 1 ] 2>/dev/null; then
            echo "::error::Noterr opened $windows windows on macOS; expected 1"
            exit 1
          fi
          pkill -f "Noterr.app/Contents/MacOS/" || true

      - name: Package .dmg
        run: |
          brew install create-dmg
          # Opens as the usual "drag Noterr to Applications" window.
          create-dmg \
            --volname "Noterr" \
            --window-size 540 340 \
            --icon-size 110 \
            --icon "Noterr.app" 140 150 \
            --app-drop-link 400 150 \
            --hide-extension "Noterr.app" \
            --no-internet-enable \
            "Noterr-v$APP_VERSION.dmg" Noterr.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: noterr-macos
          path: Noterr-v*.dmg

  # ────────────────────────────────────────────────────────────────
  # Android: built and signed on the NAS (self-hosted runner in Docker,
  # /volume1/docker/github-runners), because the signing keys live in
  # Infisical, which is Tailscale only.
  # Never runs for pull requests, so outside code can't reach the NAS.
  # ────────────────────────────────────────────────────────────────
  android:
    name: Android APK
    needs: [version, windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, nas, flutter-android]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and sign with keys from Infisical
        run: >
          bash scripts/release-android.sh
          --version '${{ needs.version.outputs.version }}'
          --build-number '${{ needs.version.outputs.build }}'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noterr-android-apk
          path: noterr-android-arm64-v*.apk

  # ────────────────────────────────────────────────────────────────
  # GitHub Release, for every push to master
  # ────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [version, windows, macos, android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List downloaded files
        run: find dist/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Noterr v${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/noterr-windows-installer/NoterrSetup-*.exe
            dist/noterr-windows-release/noterr-windows-*.zip
            dist/noterr-android-apk/noterr-android-arm64-*.apk
            dist/noterr-macos/Noterr-v*.dmg
