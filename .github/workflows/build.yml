name: Build and Release Noterr

on:
  push:
    branches: [master]
    tags:
      - 'v*'            # triggers a GitHub Release when you push v0.2.0, v0.3.0, etc.
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Android is built and signed on the owner's PC by
  # scripts/release-android.ps1, with keys from Infisical. GitHub holds
  # no signing secrets, so there is no Android job here.

  # ────────────────────────────────────────────────────────────────
  # Windows
  # ────────────────────────────────────────────────────────────────
  windows:
    name: Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Read version from pubspec
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1) -replace 'version:\s*', '' -replace '\+.*', ''
          "app_version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows release
        run: >
          flutter build windows --release
          --dart-define=NOTERR_APP_VERSION="${{ steps.version.outputs.app_version }}"

      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath noterr-windows-v${{ steps.version.outputs.app_version }}.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/noterr.iss'

      - name: Rename installer for release
        shell: pwsh
        run: |
          Copy-Item installer/dist/NoterrSetup.exe `
            NoterrSetup-v${{ steps.version.outputs.app_version }}.exe

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: noterr-windows-release
          path: noterr-windows-v*.zip

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: noterr-windows-installer
          path: NoterrSetup-v*.exe

  # ────────────────────────────────────────────────────────────────
  # GitHub Release  (only on version tags like v0.2.0)
  # ────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List downloaded files
        run: find dist/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Noterr ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/noterr-windows-installer/NoterrSetup-*.exe
            dist/noterr-windows-release/noterr-windows-*.zip
