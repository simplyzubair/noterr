name: Build and Release Noterr

# Every push to master that changes the app becomes a release: the version is
# <major>.<minor> from pubspec.yaml plus the run number, so nobody bumps
# versions or pushes tags by hand. Installed apps see the new release and
# update.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'website/**', 'deploy/**', '.env.example']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//' | cut -d. -f1,2)
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # Android versionCode must always grow; +100 keeps it above the
          # hand-set build numbers used before this scheme.
          echo "build=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"
          echo "version $base.${{ github.run_number }}"

  # ────────────────────────────────────────────────────────────────
  # Windows
  # ────────────────────────────────────────────────────────────────
  windows:
    name: Windows App
    needs: version
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter --version | head -1
          flutter analyze 2>&1 | tee analyze.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            # Run logs need auth to read; annotations don't, so surface the issues.
            detail=$( (grep -E '^ *(error|warning|info) - ' analyze.log || tail -n 15 analyze.log) | head -n 15 | paste -sd '~' - | cut -c1-3500)
            echo "::error::flutter analyze failed: $detail"
            exit "$code"
          fi

      - name: Test
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        run: >
          flutter build windows --release
          --build-name=$env:APP_VERSION --build-number=$env:APP_BUILD
          --dart-define=NOTERR_APP_VERSION=$env:APP_VERSION

      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath noterr-windows-v$env:APP_VERSION.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer/noterr.iss'

      - name: Rename installer for release
        shell: pwsh
        run: |
          Copy-Item installer/dist/NoterrSetup.exe `
            NoterrSetup-v$env:APP_VERSION.exe

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: noterr-windows-release
          path: noterr-windows-v*.zip

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: noterr-windows-installer
          path: NoterrSetup-v*.exe

  # ────────────────────────────────────────────────────────────────
  # Android: built and signed on the owner's PC (self-hosted runner),
  # because the signing keys live in Infisical, which is Tailscale only.
  # Never runs for pull requests, so outside code can't reach that PC.
  # ────────────────────────────────────────────────────────────────
  android:
    name: Android APK
    needs: [version, windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, windows, noterr-android]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and sign with keys from Infisical
        shell: powershell
        # Run in its own hidden console. When the build ends, a tool in the
        # chain sends Ctrl+C to its console group; sharing the runner's console
        # made the runner itself shut down mid-job.
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'android-build.log'
          $p = Start-Process powershell -WindowStyle Hidden -Wait -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err" `
            -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass',
              '-File', 'scripts/release-android.ps1', '-Robot',
              '-Version', '${{ needs.version.outputs.version }}',
              '-BuildNumber', '${{ needs.version.outputs.build }}')
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
          exit $p.ExitCode

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noterr-android-apk
          path: noterr-android-arm64-v*.apk

  # ────────────────────────────────────────────────────────────────
  # GitHub Release, for every push to master
  # ────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [version, windows, android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List downloaded files
        run: find dist/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Noterr v${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/noterr-windows-installer/NoterrSetup-*.exe
            dist/noterr-windows-release/noterr-windows-*.zip
            dist/noterr-android-apk/noterr-android-arm64-*.apk
