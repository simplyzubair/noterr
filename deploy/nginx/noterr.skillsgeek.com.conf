# Host nginx on Contabo -> Coolify app "noterr" (docker-compose.yml).
#   /       -> website       127.0.0.1:3003
#   /sync/  -> sync server   127.0.0.1:3004
# Install as /etc/nginx/sites-available/noterr, symlink into sites-enabled,
# `nginx -t && systemctl reload nginx`, then
# `certbot --nginx -d noterr.skillsgeek.com` to add HTTPS (certbot edits this
# file and adds the 443 server and the HTTP->HTTPS redirect).

# The sync id is a hash of a 6-digit PIN, so guessing ids must be slow.
# Normal use is a few requests a minute per device; the burst covers the
# first sync, which uploads every note. The DNS record must be "DNS only"
# (not proxied by Cloudflare), or every client would share one IP here.
limit_req_zone $binary_remote_addr zone=noterr_sync:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name noterr.skillsgeek.com;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location /sync/ {
        limit_req zone=noterr_sync burst=120 nodelay;
        limit_req_status 429;
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:3004/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
