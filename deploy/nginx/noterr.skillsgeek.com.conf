# Host nginx on Contabo -> Coolify app "noterr-website" (127.0.0.1:3003).
# Install as /etc/nginx/sites-available/noterr, symlink into sites-enabled,
# then `nginx -t && systemctl reload nginx` and
# `certbot --nginx -d noterr.skillsgeek.com` to add HTTPS (certbot edits this
# block and adds the 443 server and the HTTP->HTTPS redirect).
server {
    listen 80;
    listen [::]:80;
    server_name noterr.skillsgeek.com;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
